
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#176b4d">
<title>Resources Deck</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f4f7f4;
 color:#24352c;
}
header{
 background:#176b4d;
 color:white;
 padding:20px;
 text-align:center;
}
header h1{margin:0 0 8px}
nav{
 display:flex;
 justify-content:center;
 flex-wrap:wrap;
 gap:8px;
 padding:12px;
 background:white;
 position:sticky;
 top:0;
 z-index:5;
 box-shadow:0 2px 6px #0001;
}
button{
 border:0;
 border-radius:7px;
 padding:10px 15px;
 background:#176b4d;
 color:white;
 cursor:pointer;
}
nav button{background:#e5f1e9;color:#176b4d}
nav button:hover{background:#cce6d5}
.container{padding:16px;max-width:1100px;margin:auto}
input,select,textarea{
 width:100%;
 padding:11px;
 margin:7px 0 13px;
 border:1px solid #ccd7ce;
 border-radius:7px;
 font-size:15px;
}
label{font-weight:bold}
.products{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
 gap:15px;
}
.card{
 background:white;
 border-radius:12px;
 padding:13px;
 box-shadow:0 2px 8px #0001;
}
.card img{
 width:100%;
 height:160px;
 object-fit:cover;
 border-radius:8px;
 background:#eee;
}
.card h3{margin:10px 0 5px}
.price{color:#176b4d;font-weight:bold}
.small{font-size:13px;color:#66756b}
.section{display:none}
.section.active{display:block}
.panel{
 background:white;
 padding:17px;
 border-radius:12px;
 margin:12px 0;
}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.actions button{flex:1}
.danger{background:#b83232}
.secondary{background:#65756b}
hr{border:0;border-top:1px solid #e2e8e3;margin:15px 0}
</style>
</head>

<body>

<header>
 <h1>📚 Resources Deck</h1>
 <p>Students ke liye ek hi jagah par study resources</p>
</header>

<nav>
 <button onclick="showSection('store')">Store</button>
 <button onclick="showSection('cart')">My Cart</button>
 <button onclick="showSection('owner')">Owner</button>
</nav>

<main class="container">

<section id="store" class="section active">
 <h2>Explore Resources</h2>

 <input id="search" type="search" placeholder="Product search karein..." oninput="renderProducts()">

 <select id="categoryFilter" onchange="renderProducts()">
  <option value="all">All Categories</option>
  <option value="Books">Books</option>
  <option value="Notes">Notes</option>
  <option value="Stationery">Stationery</option>
  <option value="Other">Other</option>
 </select>

 <div id="productList" class="products"></div>
</section>

<section id="cart" class="section">
 <h2>My Cart</h2>
 <div id="cartList"></div>
 <div class="panel">
  <h3>Order Details</h3>

  <label>Your Name</label>
  <input id="customerName" placeholder="Apna naam likhein">

  <label>Mobile Number</label>
  <input id="customerPhone" type="tel" maxlength="10" placeholder="10 digit mobile number">

  <label>Full Address</label>
  <textarea id="customerAddress" rows="3" placeholder="Apna poora address likhein"></textarea>

  <p><b>Payment Method:</b> Cash on Delivery (COD) only</p>
  <button onclick="placeOrder()">Confirm Order on WhatsApp</button>
 </div>
</section>

<section id="owner" class="section">
 <h2>Owner Dashboard</h2>

 <div id="ownerLogin" class="panel">
  <p>Owner login karne ke liye password daalein.</p>
  <input id="ownerPassword" type="password" placeholder="Owner password">
  <button onclick="loginOwner()">Login</button>
 </div>

 <div id="ownerPanel" style="display:none">
  <div class="panel">
   <h3>Add / Edit Product</h3>

   <input type="hidden" id="editId">

   <label>Product Name</label>
   <input id="productName" placeholder="Product ka naam">

   <label>Category</label>
   <select id="productCategory">
    <option>Books</option>
    <option>Notes</option>
    <option>Stationery</option>
    <option>Other</option>
   </select>

   <label>Product Image URL</label>
   <input id="productImage" placeholder="Image link (optional)">

   <label>Buy Price (₹)</label>
   <input id="buyPrice" type="number" min="1" placeholder="Buy price">

   <label>Rent Price Per Day (₹) — 1 se 30</label>
   <input id="rentPrice" type="number" min="1" max="30" placeholder="Rent price per day">

   <label>Description</label>
   <textarea id="productDescription" rows="3" placeholder="Product ki details"></textarea>

   <button onclick="saveProduct()">Save Product</button>
   <button class="secondary" onclick="clearForm()">Clear Form</button>
  </div>

  <div class="panel">
   <h3>Manage Products</h3>
   <div id="manageProducts"></div>
  </div>

  <button class="secondary" onclick="logoutOwner()">Logout</button>
 </div>
</section>

</main>

<script>
const WHATSAPP_NUMBER = "919582398579";

// Apna private password yahan khud set karein.
// Is password ko kisi ke saath share na karein.
const OWNER_PASSWORD = "CHANGE_THIS_PASSWORD";

const defaultProducts = [
 {
  id:1,name:"NCERT Science Book",category:"Books",
  image:"",buy:95,rent:8,
  description:"Science study book"
 },
 {
  id:2,name:"Mathematics Textbook",category:"Books",
  image:"",buy:120,rent:10,
  description:"Mathematics textbook"
 },
 {
  id:3,name:"Student Stationery Kit",category:"Stationery",
  image:"",buy:180,rent:5,
  description:"Useful stationery items"
 },
 {
  id:4,name:"School Backpack",category:"Other",
  image:"",buy:650,rent:25,
  description:"Student backpack"
 },
 {
  id:5,name:"Scientific Calculator",category:"Stationery",
  image:"",buy:850,rent:30,
  description:"Scientific calculator"
 },
 {
  id:6,name:"Geometry Box",category:"Stationery",
  image:"",buy:90,rent:5,
  description:"Geometry box"
 },
 {
  id:7,name:"Exam Preparation Guide",category:"Books",
  image:"",buy:220,rent:12,
  description:"Exam preparation guide"
 },
 {
  id:8,name:"Study Notes",category:"Notes",
  image:"",buy:50,rent:3,
  description:"Helpful study notes"
 }
];

function loadProducts(){
 try{
  const saved=localStorage.getItem("rd_products");
  return saved ? JSON.parse(saved) : defaultProducts;
 }catch(e){
  return defaultProducts;
 }
}

let products=loadProducts();
let cart=[];

function saveProductsToStorage(){
 localStorage.setItem("rd_products",JSON.stringify(products));
}

function showSection(id){
 document.querySelectorAll(".section").forEach(s=>{
  s.classList.remove("active");
 });
 document.getElementById(id).classList.add("active");

 if(id==="cart") renderCart();
 if(id==="owner") renderManageProducts();
}

function safeText(value){
 return String(value ?? "").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[c]));
}

function renderProducts(){
 const search=document.getElementById("search").value.toLowerCase();
 const category=document.getElementById("categoryFilter").value;

 const filtered=products.filter(p=>
  p.name.toLowerCase().includes(search) &&
  (category==="all" || p.category===category)
 );

 const list=document.getElementById("productList");

 if(filtered.length===0){
  list.innerHTML="<p>Koi product nahi mila.</p>";
  return;
 }

 list.innerHTML=filtered.map(p=>`
  <div class="card">
   <img src="${safeText(p.image || "https://placehold.co/400x250?text=Resources+Deck")}" alt="${safeText(p.name)}" onerror="this.src='https://placehold.co/400x250?text=No+Image'">
   <h3>${safeText(p.name)}</h3>
   <p class="small">${safeText(p.category)}</p>
   <p>${safeText(p.description)}</p>
   <p class="price">Buy: ₹${p.buy}</p>
   <p class="price">Rent: ₹${p.rent}/day</p>
   <div class="actions">
    <button onclick="addToCart(${p.id},'Buy')">Buy</button>
    <button onclick="addToCart(${p.id},'Rent')">Rent</button>
   </div>
  </div>
 `).join("");
}

function addToCart(id,type){
 const product=products.find(p=>p.id===id);
 if(!product)return;

 let days=1;

 if(type==="Rent"){
  const answer=prompt("Kitne din ke liye rent chahiye? (1 se 365)", "7");
  if(answer===null)return;
  days=Number(answer);
  if(!Number.isInteger(days)||days<1||days>365){
   alert("1 se 365 din ke beech number daalein.");
   return;
  }
 }

 cart.push({
  id:product.id,
  type:type,
  days:days
 });

 alert("Product cart mein add ho gaya!");
 renderCart();
}

function getCartTotal(){
 return cart.reduce((sum,item)=>{
  const p=products.find(x=>x.id===item.id);
  if(!p)return sum;
  return sum+(item.type==="Buy"?p.buy:p.rent*item.days);
 },0);
}

function renderCart(){
 const list=document.getElementById("cartList");

 if(cart.length===0){
  list.innerHTML="<p>Your cart is empty.</p>";
  return;
 }

 list.innerHTML=cart.map((item,index)=>{
  const p=products.find(x=>x.id===item.id);
  if(!p)return "";
  const price=item.type==="Buy"?p.buy:p.rent*item.days;

  return `
   <div class="panel">
    <b>${safeText(p.name)}</b>
    <p>Order type: ${item.type}</p>
    ${item.type==="Rent"?`<p>Days: ${item.days}</p>`:""}
    <p>Price: ₹${price}</p>
    <button class="danger" onclick="removeCartItem(${index})">Remove</button>
   </div>
  `;
 }).join("");

 list.innerHTML+=`<h3>Total: ₹${getCartTotal()}</h3>`;
}

function removeCartItem(index){
 cart.splice(index,1);
 renderCart();
}

function placeOrder(){
 if(cart.length===0){
  alert("Pehle cart mein product add karein.");
  return;
 }

 const name=document.getElementById("customerName").value.trim();
 const phone=document.getElementById("customerPhone").value.trim();
 const address=document.getElementById("customerAddress").value.trim();

 if(!name||!phone||!address){
  alert("Naam, mobile number aur address bharein.");
  return;
 }

 if(!/^[6-9]\d{9}$/.test(phone)){
  alert("Sahi 10 digit mobile number daalein.");
  return;
 }

 let message="*New Resources Deck Order*%0A%0A";
 message+="Name: "+encodeURIComponent(name)+"%0A";
 message+="Phone: "+encodeURIComponent(phone)+"%0A";
 message+="Address: "+encodeURIComponent(address)+"%0A";
 message+="Payment: Cash on Delivery%0A%0A";
 message+="*Products:*%0A";

 cart.forEach((item,index)=>{
  const p=products.find(x=>x.id===item.id);
  if(!p)return;
  message+=(index+1)+". "+encodeURIComponent(p.name)+"%0A";
  message+="Type: "+item.type+"%0A";
  if(item.type==="Rent"){
   message+="Days: "+item.days+"%0A";
  }
  message+="Price: Rs. "+(item.type==="Buy"?p.buy:p.rent*item.days)+"%0A%0A";
 });

 message+="Total: Rs. "+getCartTotal();

 const url="https://wa.me/"+WHATSAPP_NUMBER+"?text="+message;
 window.open(url,"_blank");
}

function loginOwner(){
 const password=document.getElementById("ownerPassword").value;
 if(password===2016045826599715){
  document.getElementById("ownerLogin").style.display="none";
  document.getElementById("ownerPanel").style.display="block";
  renderManageProducts();
 }else{
  alert("Wrong password!");
 }
}

function logoutOwner(){
 document.getElementById("ownerLogin").style.display="block";
 document.getElementById("ownerPanel").style.display="none";
 document.getElementById("ownerPassword").value="";
}

function saveProduct(){
 const id=document.getElementById("editId").value;
 const name=document.getElementById("productName").value.trim();
 const category=document.getElementById("productCategory").value;
 const image=document.getElementById("productImage").value.trim();
 const buy=Number(document.getElementById("buyPrice").value);
 const rent=Number(document.getElementById("rentPrice").value);
 const description=document.getElementById("productDescription").value.trim();

 if(!name||!Number.isFinite(buy)||buy<1){
  alert("Product name aur sahi buy price daalein.");
  return;
 }

 if(!Number.isInteger(rent)||rent<1||rent>30){
  alert("Rent price 1 se 30 rupaye per day hona chahiye.");
  return;
 }

 const product={
  id:id?Number(id):Date.now(),
  name,category,image,buy,rent,description
 };

 if(id){
  products=products.map(p=>p.id===Number(id)?product:p);
 }else{
  products.push(product);
 }

 saveProductsToStorage();
 clearForm();
 renderProducts();
 renderManageProducts();
 alert("Product save ho gaya!");
}

function editProduct(id){
 const p=products.find(x=>x.id===id);
 if(!p)return;

 document.getElementById("editId").value=p.id;
 document.getElementById("productName").value=p.name;
 document.getElementById("productCategory").value=p.category;
 document.getElementById("productImage").value=p.image||"";
 document.getElementById("buyPrice").value=p.buy;
 document.getElementById("rentPrice").value=p.rent;
 document.getElementById("productDescription").value=p.description||"";

 window.scrollTo({top:0,behavior:"smooth"});
}

function deleteProduct(id){
 if(!confirm("Kya aap is product ko delete karna chahte hain?"))return;

 products=products.filter(p=>p.id!==id);
 saveProductsToStorage();
 renderProducts();
 renderManageProducts();
}

function clearForm(){
 document.getElementById("editId").value="";
 document.getElementById("productName").value="";
 document.getElementById("productCategory").value="Books";
 document.getElementById("productImage").value="";
 document.getElementById("buyPrice").value="";
 document.getElementById("rentPrice").value="";
 document.getElementById("productDescription").value="";
}

function renderManageProducts(){
 const box=document.getElementById("manageProducts");
 if(!box)return;

 if(products.length===0){
  box.innerHTML="<p>No products added.</p>";
  return;
 }

 box.innerHTML=products.map(p=>`
  <div class="panel">
   <b>${safeText(p.name)}</b>
   <p>Buy: ₹${p.buy} | Rent: ₹${p.rent}/day</p>
   <div class="actions">
    <button onclick="editProduct(${p.id})">Edit</button>
    <button class="danger" onclick="deleteProduct(${p.id})">Delete</button>
   </div>
  </div>
 `).join("");
}

renderProducts();
</script>

</body>
     </html>
